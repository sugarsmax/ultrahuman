name: Nightly Dashboard Update

on:
  schedule:
    - cron: "0 17 * * *" # 9:00 AM PST
    - cron: "0 20 * * *" # 12:00 PM PST
    - cron: "0 5 * * *"  # 9:00 PM PST
  workflow_dispatch:

env:
  TZ: America/Los_Angeles

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch last 4 weeks of metrics
        env:
          ULTRAHUMAN_API_TOKEN: ${{ secrets.ULTRAHUMAN_API_TOKEN }}
          ULTRAHUMAN_EMAIL: ${{ secrets.ULTRAHUMAN_EMAIL }}
        run: |
          mkdir -p data
          python scripts/ultrahuman_query_20251209.py \
            --weeks-back 4 \
            --output data/last_7_days.json

      - name: Generate charts
        run: |
          mkdir -p output
          python scripts/hr_charts_20251209.py --input data/last_7_days.json --week-offset 0
          python scripts/hr_charts_20251209.py --input data/last_7_days.json --week-offset 1
          python scripts/hr_charts_20251209.py --input data/last_7_days.json --week-offset 2
          python scripts/hr_charts_20251209.py --input data/last_7_days.json --week-offset 3

      - name: Extract and merge daily summaries
        run: python scripts/extract_daily_summaries_20260302.py --input data/last_7_days.json

      - name: Commit daily summaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily_summaries.json
          git diff --cached --quiet || git commit -m "chore: update daily summaries $(date +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push

      - name: Build dashboard HTML
        run: python scripts/build_page_20260302.py --data data/last_7_days.json

      # Deploy must run in a separate job so artifact metadata is visible (deploy-pages#451).
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment3.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      # Pages API intermittently returns 5xx (run #803); retry with separate deploy steps.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before retry
        if: steps.deployment.outcome != 'success'
        run: sleep 45
      - name: Deploy to GitHub Pages (2)
        if: steps.deployment.outcome != 'success'
        id: deployment2
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before retry
        if: steps.deployment.outcome != 'success' && steps.deployment2.outcome != 'success'
        run: sleep 45
      - name: Deploy to GitHub Pages (3)
        if: steps.deployment.outcome != 'success' && steps.deployment2.outcome != 'success'
        id: deployment3
        uses: actions/deploy-pages@v5
      - name: Fail if deploy did not succeed
        if: >-
          steps.deployment.outcome != 'success'
          && steps.deployment2.outcome != 'success'
          && steps.deployment3.outcome != 'success'
        run: |
          echo "All deploy attempts failed."
          exit 1